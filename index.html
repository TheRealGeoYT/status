<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheRealGeo • Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131d31;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f293d;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Gesamt-Status Banner */
        .overall-banner {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--warning);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            flex-shrink: 0;
        }

        .status-dot.online {
            background-color: var(--success);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-dot.offline {
            background-color: var(--danger);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .banner-text h2 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .banner-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Dienste Karten Container */
        .services-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.1s;
        }

        .service-card:hover {
            border-color: #374151;
            transform: translateY(-1px);
        }

        .service-meta h3 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .service-meta span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .service-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .mini-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .mini-dot.online { background-color: var(--success); }
        .mini-dot.offline { background-color: var(--danger); }
        .mini-dot.checking { background-color: var(--warning); }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>System Status</h1>
            <p class="subtitle">Echtzeit-Übersicht aller TheRealGeo Dienste</p>
        </header>

        <!-- Globaler Status Header -->
        <div class="overall-banner" id="overall-banner">
            <div class="status-dot" id="overall-dot"></div>
            <div class="banner-text">
                <h2 id="overall-title">Systeme werden überprüft...</h2>
                <p id="overall-desc">Bitte einen Moment Geduld.</p>
            </div>
        </div>

        <!-- Die 2 Haupt-Dienste -->
        <div class="services-stack">
            
            <!-- Dienst 1: Portfolio -->
            <a href="https://therealgeo.de" target="_blank" class="service-card">
                <div class="service-meta">
                    <h3>Portfolio Hauptseite</h3>
                    <span>therealgeo.de</span>
                </div>
                <div class="service-status">
                    <span id="status-text-0">Prüfe...</span>
                    <div class="mini-dot checking" id="status-dot-0"></div>
                </div>
            </a>

            <!-- Dienst 2: Statusseite / Sonstige Dienste -->
            <a href="https://status.therealgeo.de" class="service-card">
                <div class="service-meta">
                    <h3>Status & Sonstige Dienste</h3>
                    <span>status.therealgeo.de</span>
                </div>
                <div class="service-status">
                    <span id="status-text-1">Prüfe...</span>
                    <div class="mini-dot checking" id="status-dot-1"></div>
                </div>
            </a>

        </div>

        <footer>
            Betrieben über GitHub Pages • <a href="https://therealgeo.de">Zurück zur Hauptseite</a>
        </footer>
    </div>

    <script>
        const services = [
            { name: "Portfolio", url: "https://therealgeo.de" },
            { name: "Statusseite", url: "https://status.therealgeo.de" }
        ];

        async function checkStatus() {
            let allOnline = true;

            for (let i = 0; i < services.length; i++) {
                const textElem = document.getElementById(`status-text-${i}`);
                const dotElem = document.getElementById(`status-dot-${i}`);

                try {
                    await fetch(services[i].url, { mode: 'no-cors', cache: 'no-cache' });
                    textElem.innerText = "Online";
                    textElem.style.color = "var(--success)";
                    dotElem.className = "mini-dot online";
                } catch (error) {
                    allOnline = false;
                    textElem.innerText = "Offline";
                    textElem.style.color = "var(--danger)";
                    dotElem.className = "mini-dot offline";
                }
            }

            const overallDot = document.getElementById("overall-dot");
            const overallTitle = document.getElementById("overall-title");
            const overallDesc = document.getElementById("overall-desc");

            if (allOnline) {
                overallDot.className = "status-dot online";
                overallTitle.innerText = "Alle Systeme betriebsbereit";
                overallDesc.innerText = "Beide Dienste sind fehlerfrei erreichbar.";
            } else {
                overallDot.className = "status-dot offline";
                overallTitle.innerText = "Störung erkannt";
                overallDesc.innerText = "Mindestens ein Dienst ist aktuell offline.";
            }
        }

        checkStatus();
        setInterval(checkStatus, 120000); // Alle 2 Minuten aktualisieren
    </script>
</body>
</html>
